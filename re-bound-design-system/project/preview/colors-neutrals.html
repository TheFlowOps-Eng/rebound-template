<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Colors — Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--umber-deep); font-family: var(--font-label); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .sw { aspect-ratio: 1 / 1.1; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; border: 1px solid rgba(255,255,255,.08); }
  .sw .name { font-size: 10px; letter-spacing: .13em; text-transform: uppercase; font-weight: 700; line-height: 1.4; }
  .sw .hex { font-size: 9.5px; opacity: .72; margin-top: 2px; }
  .ivory    { background: var(--ivory);    color: var(--espresso); }
  .linen    { background: var(--linen);    color: var(--espresso); }
  .bone     { background: var(--bone);     color: var(--espresso); }
  .sand     { background: var(--sand);     color: var(--espresso); }
  .stone    { background: var(--stone);    color: var(--espresso); }
</style></head>
<body>
  <div class="row">
    <div class="sw ivory"><span class="name">Ivory</span><span class="hex">#FEFFF0</span></div>
    <div class="sw linen"><span class="name">Linen</span><span class="hex">#FBFBF2</span></div>
    <div class="sw bone"><span class="name">Bone</span><span class="hex">#EBECDD</span></div>
    <div class="sw sand"><span class="name">Sand</span><span class="hex">#F3F3F0</span></div>
    <div class="sw stone"><span class="name">Stone</span><span class="hex">#D0D0C5</span></div>
  </div>
</body></html>
