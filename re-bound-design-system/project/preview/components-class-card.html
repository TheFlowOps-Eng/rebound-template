<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Class Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bone); }
  .card { width: 320px; background: var(--clay); overflow: hidden; }
  .card img { width: 100%; height: 200px; object-fit: cover; display: block; border: 2px solid var(--umber); box-sizing: border-box; }
  .body { padding: 20px; color: var(--white); }
  .h { font-family: var(--font-display); font-weight: 400; font-size: 36px; letter-spacing: -.01em; line-height: 1; margin: 0 0 10px; color: var(--white); }
  .p { font-family: var(--font-body); font-weight: 400; font-size: 14px; line-height: 1.5; color: var(--white); margin: 0 0 14px; }
  .cta { font-family: var(--font-label); font-weight: 400; font-size: 12px; letter-spacing: .13em; text-transform: uppercase; color: var(--white); text-decoration: underline; text-underline-offset: 4px; }
</style></head>
<body>
  <div class="card">
    <img src="../assets/class-tile.jpg" alt="">
    <div class="body">
      <h3 class="h">Sculpt</h3>
      <p class="p">Targeted sequences. Slow lunges, long planks, and a shake that means it's working.</p>
      <a class="cta" href="#">Book Sculpt  →</a>
    </div>
  </div>
</body></html>
