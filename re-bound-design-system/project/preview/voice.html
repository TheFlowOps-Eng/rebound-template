<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Voice</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 26px 30px; background: var(--bone); color: var(--espresso); }
  .e { font-family: var(--font-label); font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--fg-subtle); }
  .h { font-family: var(--font-display); font-weight: 400; font-size: 42px; line-height: 1.1; letter-spacing: -.02em; margin: 6px 0 14px; }
  .p { font-family: var(--font-body); font-size: 17px; font-weight: 400; line-height: 1.5; color: var(--clove); max-width: 580px; }
  em { font-style: italic; color: var(--umber); }
</style></head>
<body>
  <div class="e">The Method</div>
  <div class="h">Not Pilates. Not yoga.<br>Something that borrows from both — and outworks them.</div>
  <div class="p"><em>"The slower you go, the harder it gets."</em> Short sentences. Em-dashes for pairing. Periods for emphasis. Second person. No hype.</div>
</body></html>
