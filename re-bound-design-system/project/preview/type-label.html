<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Type — Label</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 36px; background: var(--bone); font-family: var(--font-label); color: var(--espresso); }
  .stack { display: flex; flex-direction: column; gap: 22px; }
  .row { display: flex; align-items: center; gap: 28px; }
  .meta { font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--fg-subtle); min-width: 180px; font-weight: 600; }
  .eyebrow-lg { font-size: 17px; font-weight: 700; letter-spacing: .20em; text-transform: uppercase; }
  .label    { font-size: 14px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
  .small    { font-size: 12px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
</style></head>
<body>
  <div class="stack">
    <div class="row"><span class="meta">Eyebrow · 17 · 700 · .20em</span><span class="eyebrow-lg">Get Ready to Transform</span></div>
    <div class="row"><span class="meta">Label · 14 · 700 · .13em</span><span class="label">Book Now</span></div>
    <div class="row"><span class="meta">Micro · 12 · 700 · .13em</span><span class="small">Megaformer · 50 min</span></div>
  </div>
</body></html>
