<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Display type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px; background: var(--bone); color: var(--espresso); display: flex; flex-direction: column; gap: 20px; }
  .row { display: flex; align-items: baseline; gap: 24px; }
  .meta { font-family: var(--font-label); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--fg-subtle); min-width: 110px; flex-shrink: 0; padding-top: 14px; }
  .sample { font-family: var(--font-display); font-weight: 400; color: var(--espresso); line-height: 1; letter-spacing: -0.02em; }
  .sample em { font-style: italic; }
</style></head>
<body>
  <div class="row"><span class="meta">Hero · 148/1</span><span class="sample" style="font-size: 88px;">Rebound</span></div>
  <div class="row"><span class="meta">Page · 100/1</span><span class="sample" style="font-size: 62px;">The method</span></div>
  <div class="row"><span class="meta">Section · 76/1</span><span class="sample" style="font-size: 48px;"><em>Discipline</em> meets softness.</span></div>
  <div class="row"><span class="meta">Card · 48/1</span><span class="sample" style="font-size: 32px;">Sculpt · Flow · Restore</span></div>
</body></html>
