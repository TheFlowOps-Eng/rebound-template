<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Re:Bound — Website UI Kit</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bone); }
    body { font-family: var(--font-body); color: var(--espresso); min-height: 100vh; }
    ::selection { background: var(--umber); color: var(--bone); }
    a { color: inherit; }
    /* Fixed nav overlays every screen */
    .nav-mount { position: sticky; top: 0; height: 0; z-index: 100; }
    .nav-mount > * { pointer-events: auto; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="HomeScreen.jsx"></script>
  <script type="text/babel" src="AboutScreen.jsx"></script>
  <script type="text/babel" src="ClassesScreen.jsx"></script>
  <script type="text/babel" src="InstructorsScreen.jsx"></script>
  <script type="text/babel" src="ContactScreen.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [screen, setScreen] = useState(() => {
        return localStorage.getItem('rebound:screen') || 'home';
      });
      useEffect(() => { localStorage.setItem('rebound:screen', screen); window.scrollTo(0, 0); }, [screen]);

      const go = (s) => setScreen(s);

      // A few unbuilt routes (about, pricing, studio) redirect to home for now
      const routable = { home: HomeScreen, about: AboutScreen, classes: ClassesScreen, instructors: InstructorsScreen, contact: ContactScreen };
      const Comp = routable[screen] || HomeScreen;

      // The nav needs to be OVER the hero. Each screen renders its own background;
      // we mount TopNav on top, absolutely positioned. For the contact screen
      // which has a dark solid background, we use onLightBg=false still.
      const lightNav = false;

      return (
        <div data-screen-label={screen} style={{ position: 'relative' }}>
          <TopNav current={screen} go={go} onLightBg={lightNav} />
          <Comp go={go} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
